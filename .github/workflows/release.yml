name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create HACS Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update manifest version
        run: |
          sed -i 's/"version": ".*"/"version": "${{ steps.version.outputs.version }}"/' \
            custom_components/tongwangas_shandong/manifest.json

      - name: Package integration
        run: |
          cd custom_components
          zip -r ../tongwangas_shandong.zip tongwangas_shandong/ \
            -x "*/__pycache__/*" -x "*.pyc" -x "*/.DS_Store"
          cd ..
          echo "SHA256: $(sha256sum tongwangas_shandong.zip)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body: |
            ## 山东港华燃气 ${{ github.ref_name }}

            山东港华燃气 Home Assistant 集成

            ### 安装方式

            [![Open your Home Assistant instance and add this repository in HACS](https://my.home-assistant.io/badges/hacs_repository.svg)](https://my.home-assistant.io/redirect/hacs_repository/?owner=mingyue5826&repository=TongwangasShandong&category=integration)

            **HACS(推荐)**：点上面的按钮一键添加，或者手动操作：在 HACS 中添加本仓库为自定义集成，搜索`山东港华燃气`安装。

            **手动安装**：下载 `tongwangas_shandong.zip`，解压后将 `tongwangas_shandong/` 目录放入 HA 的 `config/custom_components/`，重启 HA 即可。

            ### 用气卡片（Lovelace）

            集成附带零依赖 Lovelace 卡片（可用余额/应缴费用/累计用气量、用气阶梯、用气日历、年对比用气曲线、用气明细、日用气曲线）。

            **卡片随集成自动就绪：无需手动复制文件，也无需手动在仪表盘里添加 JS 资源。** 集成启动时会自动把卡片目录挂载为静态路径 `/tongwangas_shandong/`，并把卡片登记为 Lovelace 资源（storage 资源模式写入资源表；yaml 模式退回全局注入）。

            添加卡片：仪表盘 → 编辑 → **+ 添加卡片** → 搜索「港华燃气用气卡片」，或选 **手动** 填入：

            ```yaml
            type: custom:tongwangas-shandong-card
            gs: "户号" # 户号；留空则自动探测
            title: 港华燃气
            ```

            > 若你曾按旧版说明手动添加过 `/local/community/tongwangas-shandong/...` 资源，
            > 请到 **设置** → **仪表盘** → **⋮** → **资源** 中删除它，避免同一份 JS 被加载两次。

          files: tongwangas_shandong.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
